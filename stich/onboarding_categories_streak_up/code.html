<div class="w-20 h-20 rounded-3xl bg-secondary-container flex items-center justify-center mb-md group-hover:rotate-6 transition-transform">

      Kembali
    </button>
<div class="flex items-center gap-md">
<div class="hidden sm:flex flex-col items-end">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest" id="counter-text">2 Kategori Terpilih</span>

</div>
<button class="h-14 px-xl rounded-xl bg-primary text-on-primary font-headline-md text-headline-md shadow-lg shadow-primary/20 hover:scale-[1.05] active:scale-[0.98] transition-all" id="next-button">
        Lanjut
      </button>
</div>
</div>
<script>
    function toggleSelection(el) {
      const isSelected = el.classList.contains('selected');
      const checkMark = el.querySelector('.check-mark');
      
      if (isSelected) {
        el.classList.remove('selected', 'bg-primary-fixed/30', 'border-primary', 'shadow-md');
        el.classList.add('bg-surface-container-low', 'border-transparent', 'shadow-sm');
        checkMark.classList.remove('opacity-100');
        checkMark.classList.add('opacity-0');
      } else {
        el.classList.add('selected', 'bg-primary-fixed/30', 'border-primary', 'shadow-md');
        el.classList.remove('bg-surface-container-low', 'border-transparent', 'shadow-sm');
        checkMark.classList.remove('opacity-0');
        checkMark.classList.add('opacity-100');
        
        // Brief pop animation
        el.style.transform = 'scale(1.08)';
        setTimeout(() => {
          el.style.transform = '';
        }, 150);
      }
      
      updateCounter();
    }

    function updateCounter() {
      const selectedCount = document.querySelectorAll('.category-card.selected').length;
      const counterText = document.getElementById('counter-text');
      const nextBtn = document.getElementById('next-button');
      
      counterText.innerText = `${selectedCount} Kategori Terpilih`;
      
      if (selectedCount === 0) {
        nextBtn.classList.add('opacity-50', 'pointer-events-none');
        counterText.classList.replace('text-primary', 'text-on-surface-variant');
      } else {
        nextBtn.classList.remove('opacity-50', 'pointer-events-none');
        counterText.classList.replace('text-on-surface-variant', 'text-primary');
      }
    }
  </script>
