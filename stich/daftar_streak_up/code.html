<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = form.querySelector('button');
        const originalText = btn.innerHTML;
        
        // Simple visual feedback
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> <span>Memproses...</span>';
        btn.disabled = true;
        
        setTimeout(() => {
          btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span>Selamat Datang!</span>';
          btn.classList.replace('bg-primary', 'bg-tertiary');
          
          // Confetti-like effect or redirect logic would go here
          console.log('User registered successfully');
        }, 1500);
      });

      // Subtle parallax on illustration
      const illustration = document.querySelector('.lg\\:flex img');
      if (illustration) {
        document.addEventListener('mousemove', (e) => {
          const x = (window.innerWidth / 2 - e.pageX) / 50;
          const y = (window.innerHeight / 2 - e.pageY) / 50;
          illustration.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        });
      }
    });
